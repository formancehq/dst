name: Antithesis Instrumented Release
on:
  repository_dispatch:
    types: [release_ledger]

jobs:
  push-instrumented-ledger:
    name: Push instrumented ledger
    runs-on: namespace-profile-linux-amd64-4vcpu
    steps:
      - uses: namespacelabs/nscloud-checkout-action@v9
        with:
          fetch-depth: 0
          dissociate: true

      - uses: formancehq/ci/actions/setup-nix@main


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: "NumaryBot"
          password: ${{ secrets.NUMARY_GITHUB_TOKEN }}

      - name: Build and Push Instrumented Ledger
        env:
          LEDGER_TAG: ${{ github.event.client_payload.tag }}
        run: |
          nix develop --impure --command just --justfile ./ledger/Justfile push
